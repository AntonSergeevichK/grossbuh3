<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Гроссбух — имущество и долги</title>
<style>
:root{
  --paper:#E9EDF1; --card:#FFFFFF; --ink:#0F1A21; --soft:#5C6C78;
  --line:#D8E0E7; --accent:#0E6E62; --accent-bg:#E0EFEC;
  --clay:#A9501F; --clay-bg:#F6E9E1; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:430px;margin:0 auto;padding:0 14px 110px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

.head{display:flex;align-items:baseline;justify-content:space-between;padding:18px 2px 14px}
.head h1{font-size:19px;font-weight:650;margin:0}
.head span{font-size:12px;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px}
.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-bottom:9px}
h2.sec{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin:20px 0 9px 2px}
.empty{color:var(--soft);font-size:13px;padding:2px}

.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row:active{background:var(--accent-bg);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
.row .n{flex:1;min-width:0}
.row .n b{font-weight:500;font-size:14.5px}
.row .n small{display:block;color:var(--soft);font-size:11.5px;margin-top:2px}
.row .n small.warn{color:var(--clay)}
.row .v{font-size:15px;font-weight:600;white-space:nowrap;text-align:right}
.row .v small{display:block;font-weight:400;font-size:11px;color:var(--soft);margin-top:2px}
.row .go{color:#C3CDD5;font-size:17px;margin-left:10px}
.v.plus{color:var(--accent)} .v.minus{color:var(--clay)}
.total{display:flex;justify-content:space-between;padding-top:12px;margin-top:6px;border-top:1px solid var(--line);font-weight:650}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 12px;font-size:14px;
      cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:7px}
.chip:active{transform:scale(.97)}
.chip.on{border-color:var(--accent);background:var(--accent-bg);font-weight:600}
.chip .bal{font:11px/1 ui-monospace,monospace;color:var(--soft)}
.chip.on .bal{color:var(--accent)}

input{border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:15px system-ui,sans-serif;
      outline:none;background:var(--card);color:var(--ink);width:100%}
input:focus{border-color:var(--accent)}
.amount-row{display:flex;align-items:baseline;justify-content:center;gap:6px}
.amt{font:600 38px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;
     border:none;outline:none;text-align:right;width:100%;max-width:236px;background:transparent;padding:4px 0;color:var(--ink)}
.amt::placeholder{color:#C3CDD5}
.cur{font:500 21px/1 ui-monospace,monospace;color:var(--soft)}
.sum{display:flex;justify-content:space-between;margin-top:12px;padding:10px 12px;border-radius:9px;
     background:var(--accent-bg);color:var(--accent);font-size:13.5px}
.sum b{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
.sum.warn{background:var(--clay-bg);color:var(--clay)}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:13px 10px;
             font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.acts button:active{border-color:var(--accent);color:var(--accent)}
.acts button.wide{grid-column:1/-1}
.acts button small{display:block;color:var(--soft);font-size:11.5px;margin-top:3px}

.hero{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#8FA5B0}
.hero .v{font-size:30px;font-weight:600;margin-top:6px;font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hero .s{font-size:12px;color:#8FA5B0;margin-top:7px;line-height:1.4}

.nudge{background:var(--clay-bg);color:var(--clay);border-radius:10px;padding:12px 13px;margin-bottom:10px;font-size:13px;line-height:1.4}
.nudge button{margin-top:9px;border:1px solid var(--clay);background:none;color:var(--clay);
              border-radius:8px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}

.op{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:7px}
.op-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.op-t{font-size:14px}
.op-s{font-size:12px;color:var(--soft);margin-top:3px}
.op-a{font-size:14px;font-weight:600;white-space:nowrap}
.op-a .plus{color:var(--accent)} .op-a .minus{color:var(--clay)}
.dgrp{font-size:12px;font-weight:600;margin:14px 2px 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}

.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
     background:linear-gradient(to top,var(--paper) 74%,transparent);z-index:5}
.bar .in{max-width:430px;margin:0 auto}
.big{width:100%;border:none;border-radius:12px;padding:16px;background:var(--accent);color:#fff;
     font-size:16px;font-weight:600;cursor:pointer}
.big:disabled{background:#B8C4CC}
.big:active:not(:disabled){opacity:.88}

.screen{position:fixed;inset:0;background:var(--paper);overflow-y:auto;z-index:10}
.screen[hidden]{display:none}
.fhead{display:flex;align-items:center;gap:10px;padding:16px 2px 12px}
.fhead .x{border:none;background:none;font-size:24px;color:var(--soft);cursor:pointer;padding:0 4px}
.fhead h1{font-size:17px;font-weight:650;margin:0;flex:1}
.datechip{font-size:13px;color:var(--soft);background:var(--card);border:1px solid var(--line);
          border-radius:20px;padding:7px 12px}
.datechip input{border:none;background:none;font:inherit;color:inherit;width:100px;padding:0;outline:none}

.sheet{position:fixed;inset:0;background:rgba(15,26,33,.45);z-index:20;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet .in{background:var(--paper);width:100%;max-width:430px;margin:0 auto;
           border-radius:18px 18px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:16px}

.led-head{width:100%;background:none;border:none;color:var(--soft);font-size:13px;padding:13px 2px;cursor:pointer}
.ledger{background:#0F1A21;color:#C8D6DE;border-radius:var(--r);padding:14px;margin-bottom:12px;
        font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;overflow-x:auto}
.ledger .k{color:#5C7A88} .ledger .d{color:#7FD1C1} .ledger .c{color:#E8B08A}
.ledger table{border-collapse:collapse;width:100%}
.ledger td{padding:2px 0}
.ledger td.n{text-align:right;padding-left:12px;white-space:nowrap}
.ledger hr{border:none;border-top:1px solid #24333D;margin:9px 0}
.inv{display:flex;justify-content:space-between;color:#7FD1C1}

#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,60px);background:var(--ink);color:#fff;
       padding:12px 18px;border-radius:11px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ГЛАВНЫЙ -->
<div class="wrap" id="main">
  <div class="head"><h1>Имущество и долги</h1><span id="today"></span></div>
  <div id="nudges"></div>
  <div class="card">
    <span class="lbl">Имущество</span>
    <div id="propList"></div>
  </div>
  <div class="card">
    <span class="lbl">Долги</span>
    <div id="debtList"></div>
  </div>
  <div class="card">
    <span class="lbl">Деньги</span>
    <div id="cashList"></div>
  </div>
</div>
<div class="bar"><div class="in"><button class="big" id="plus">+ Добавить</button></div></div>

<!-- КАРТОЧКА ОБЪЕКТА -->
<div class="screen" id="obj" hidden>
 <div class="wrap">
  <div class="fhead"><button class="x" id="objBack">←</button><h1 id="objTitle"></h1></div>
  <div class="hero">
    <div class="k" id="objKind"></div>
    <div class="v" id="objVal"></div>
    <div class="s" id="objSub"></div>
  </div>
  <div id="objNudge"></div>
  <div class="card"><span class="lbl">Что можно сделать</span><div class="acts" id="objActs"></div></div>
  <h2 class="sec">История</h2>
  <div id="objHist"></div>
 </div>
</div>

<!-- ФОРМА -->
<div class="screen" id="form" hidden>
 <div class="wrap">
  <div class="fhead">
    <button class="x" id="close">×</button>
    <h1 id="fTitle"></h1>
    <label class="datechip">📅<input type="date" id="date"></label>
  </div>
  <div class="card" id="nameCard" hidden>
    <span class="lbl" id="nameLbl">Название</span>
    <input id="fname" placeholder="">
  </div>
  <div class="card" id="amtCard">
    <span class="lbl" id="amtLbl">Сумма</span>
    <div class="amount-row"><input class="amt" id="amt" inputmode="decimal" placeholder="0"><span class="cur">₽</span></div>
    <div id="amtExtra"></div>
  </div>
  <div class="card" id="moneyCard">
    <span class="lbl" id="moneyLbl">Счёт</span>
    <div class="chips" id="money"></div>
  </div>
  <button class="led-head" id="ledToggle">▸ показать проводку</button>
  <div class="ledger" id="ledger" hidden></div>
  <button class="big" id="save" disabled style="margin:6px 0 8px">Сохранить</button>
  <div id="hint" class="op-s" style="text-align:center;margin-bottom:22px"></div>
 </div>
</div>

<!-- ЛИСТ ДЕЙСТВИЙ -->
<div class="sheet" id="sheet" hidden><div class="in">
  <h3>Что добавить?</h3>
  <div class="acts">
    <button class="wide" data-a="prop_buy">Купить имущество<small>Квартира, машина, техника</small></button>
    <button class="wide" data-a="loan_give">Дать в долг<small>Деньги, которые вам вернут</small></button>
    <button class="wide" data-a="debt_take">Взять в долг<small>Заём или кредит</small></button>
  </div>
</div></div>

<div id="toast"></div>

<script>
const SIGN='₽';
const PROP=[
  {id:1,name:'Квартира',   bal:5000000,last:'2023-04-10'},
  {id:2,name:'Ноутбук',    bal:95000,  last:'2026-02-01'},
  {id:3,name:'Велосипед',  bal:42000,  last:'2019-06-15'}
];
const CTR=[
  {id:1,name:'Игорь',        owe:10000, debt:0},
  {id:2,name:'Сбербанк',     owe:0,     debt:1235400},
  {id:3,name:'Маша Степина', owe:0,     debt:25000}
];
const MONEY=[
  {id:11,name:'Альфа-Банк',bal:48250},
  {id:12,name:'Наличные',  bal:7300}
];
const CAP='Капитал · заработанный', REV='Капитал · от переоценки';
let hist=[], seq=1, kind=null, obj=null, money=MONEY[0];

const $=s=>document.querySelector(s);
const fmt=n=>(n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const parse=s=>{const v=parseFloat(String(s).replace(/\s/g,'').replace(',','.'));return isNaN(v)?0:v};
const AMT=()=>parse($('#amt').value);
const P=id=>PROP.find(x=>x.id===id), C=id=>CTR.find(x=>x.id===id), M=id=>MONEY.find(x=>x.id===id);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
const human=i=>new Date(i+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const years=i=>Math.floor((new Date()-new Date(i+'T00:00:00'))/(365.25*864e5));

/* ═══ главный экран ═══ */
function drawMain(){
  $('#today').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});

  // напоминания о переоценке — предлагаем действие, а не констатируем срок
  const old=PROP.filter(p=>years(p.last)>=2);
  $('#nudges').innerHTML=old.map(p=>`<div class="nudge">
      «${p.name}» не переоценивали ${years(p.last)} года — с ${human(p.last)}.
      Стоимость могла заметно измениться.
      <button data-rev="${p.id}">Уточнить стоимость</button></div>`).join('');

  $('#propList').innerHTML=PROP.map(p=>{
    const stale=years(p.last)>=2;
    return `<div class="row" data-obj="p${p.id}">
      <div class="n"><b>${p.name}</b>
        <small class="${stale?'warn':''}">оценка от ${human(p.last)}</small></div>
      <div class="v mono">${fmt(p.bal)} ${SIGN}</div><span class="go">›</span></div>`;
  }).join('')+`<div class="total"><span>Итого</span>
      <span class="mono">${fmt(PROP.reduce((s,p)=>s+p.bal,0))} ${SIGN}</span></div>`;

  $('#debtList').innerHTML=CTR.map(c=>{
    const net=c.owe-c.debt;
    return `<div class="row" data-obj="c${c.id}">
      <div class="n"><b>${c.name}</b>
        <small>${net>0?'должен вам':net<0?'вы должны':'расчёты закрыты'}</small></div>
      <div class="v mono ${net>0?'plus':net<0?'minus':''}">${net===0?'—':fmt(Math.abs(net))+' '+SIGN}</div>
      <span class="go">›</span></div>`;
  }).join('');

  $('#cashList').innerHTML=MONEY.map(m=>
    `<div class="row" style="cursor:default"><div class="n"><b>${m.name}</b></div>
     <div class="v mono">${fmt(m.bal)} ${SIGN}</div></div>`).join('');

  document.querySelectorAll('[data-obj]').forEach(r=>r.onclick=()=>openObj(r.dataset.obj));
  document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); obj={t:'p',o:P(+b.dataset.rev)}; openForm('prop_revalue');
  });
}

/* ═══ карточка объекта ═══ */
function openObj(key){
  const t=key[0], id=+key.slice(1);
  obj={t, o: t==='p'?P(id):C(id)};
  const o=obj.o;
  $('#objTitle').textContent=o.name;

  if(t==='p'){
    $('#objKind').textContent='Имущество · оценка в учёте';
    $('#objVal').textContent=fmt(o.bal)+' '+SIGN;
    $('#objSub').textContent='Последняя оценка — '+human(o.last);
    $('#objNudge').innerHTML = years(o.last)>=2
      ? `<div class="nudge">Прошло ${years(o.last)} года с последней оценки.
         <button data-act="prop_revalue">Уточнить стоимость</button></div>` : '';
    $('#objActs').innerHTML=`
      <button data-act="prop_revalue">Переоценить<small>Изменилась стоимость</small></button>
      <button data-act="prop_sell">Продать<small>Получить деньги</small></button>
      <button data-act="prop_writeoff" class="wide">Списать<small>Потеряно, украдено, сломалось</small></button>`;
  } else {
    const net=o.owe-o.debt;
    $('#objKind').textContent='Контрагент';
    $('#objVal').textContent=net===0?'—':fmt(Math.abs(net))+' '+SIGN;
    $('#objSub').textContent = net>0?'Должен вам' : net<0?'Вы должны' : 'Взаимных долгов нет';
    $('#objNudge').innerHTML='';
    $('#objActs').innerHTML=`
      <button data-act="loan_give">Дать в долг<small>Ещё денег</small></button>
      <button data-act="loan_return" ${o.owe<=0?'disabled style="opacity:.4"':''}>Вернули<small>Долг погашают вам</small></button>
      <button data-act="debt_take">Взять в долг<small>Занять у него</small></button>
      <button data-act="debt_repay" ${o.debt<=0?'disabled style="opacity:.4"':''}>Погасить<small>Вернуть свой долг</small></button>`;
  }

  const rel=hist.filter(h=>h.objT===t&&h.objId===o.id);
  $('#objHist').innerHTML = rel.length ? rel.map(h=>opHTML(h)).join('')
    : '<div class="empty">Операций пока не было</div>';

  document.querySelectorAll('#objActs button,[data-act]').forEach(b=>{
    if(b.disabled)return;
    b.onclick=()=>openForm(b.dataset.act);
  });
  $('#obj').hidden=false; document.body.style.overflow='hidden'; $('#obj').scrollTop=0;
}
const opHTML=h=>`<div class="op"><div class="op-top">
    <div><div class="op-t">${h.title}</div><div class="op-s">${human(h.date)}${h.note?' · '+h.note:''}</div></div>
    <div class="op-a mono"><span class="${h.sign>0?'plus':'minus'}">${h.sign>0?'+':'−'}${fmt(Math.abs(h.amt))} ${SIGN}</span></div>
  </div></div>`;

/* ═══ форма ═══ */
const CFG={
  prop_buy:      {t:'Покупка имущества', name:'Название вещи',  amt:'Сколько заплатили', mon:'Откуда деньги'},
  prop_revalue:  {t:'Переоценка',        amt:'Новая оценка'},
  prop_sell:     {t:'Продажа имущества', amt:'Цена продажи',     mon:'Куда зачислить'},
  prop_writeoff: {t:'Списание'},
  loan_give:     {t:'Дать в долг',       name:'Кому',            amt:'Сколько',           mon:'Откуда деньги'},
  loan_return:   {t:'Возврат долга',     amt:'Сколько вернули',  mon:'Куда зачислить'},
  debt_take:     {t:'Взять в долг',      name:'У кого',          amt:'Сколько',           mon:'Куда пришли'},
  debt_repay:    {t:'Погашение долга',   amt:'Сколько платите',  mon:'Откуда деньги'}
};

function openForm(k){
  kind=k; const c=CFG[k];
  $('#fTitle').textContent=c.t;
  $('#date').valueAsDate=new Date();
  $('#amt').value=''; $('#fname').value='';
  // имя спрашиваем только когда объект создаётся; иначе он уже выбран
  const needName = !!c.name && !(obj&&obj.o&&((k==='loan_give'&&obj.t==='c')||(k==='debt_take'&&obj.t==='c')));
  $('#nameCard').hidden=!needName;
  $('#nameLbl').textContent=c.name||'';
  $('#amtCard').hidden = k==='prop_writeoff';
  $('#amtLbl').textContent=c.amt||'';
  $('#moneyCard').hidden=!c.mon;
  $('#moneyLbl').textContent=c.mon||'';
  drawMoney(); refresh();
  $('#form').hidden=false; document.body.style.overflow='hidden'; $('#form').scrollTop=0;
}
function drawMoney(){
  $('#money').innerHTML='';
  MONEY.forEach(m=>{
    const b=document.createElement('button');
    b.className='chip'+(money.id===m.id?' on':'');
    b.innerHTML=`<span>${m.name}</span><span class="bal">${fmt(m.bal)} ${SIGN}</span>`;
    b.onclick=()=>{money=m;drawMoney();refresh()};
    $('#money').appendChild(b);
  });
}

function refresh(){
  const c=CFG[kind], o=obj?obj.o:null;
  let extra='', ok=true, hint='';

  if(kind==='prop_revalue'&&o){
    const d=AMT()-o.bal;
    extra=`<div class="sum ${d<0?'warn':''}"><span>${d>=0?'Дороже на':'Дешевле на'}</span>
           <b>${fmt(Math.abs(d))} ${SIGN}</b></div>
           <div class="op-s" style="margin-top:9px">Сейчас в учёте ${fmt(o.bal)} ${SIGN}.
           Разница уйдёт в капитал — движения денег нет.</div>`;
    ok = AMT()>0 && Math.abs(d)>0.005;
  }
  if(kind==='prop_sell'&&o){
    const d=AMT()-o.bal;
    extra=`<div class="sum ${d<0?'warn':''}"><span>${d>=0?'Прибыль':'Убыток'}</span>
           <b>${fmt(Math.abs(d))} ${SIGN}</b></div>
           <div class="op-s" style="margin-top:9px">В учёте вещь стоит ${fmt(o.bal)} ${SIGN}.
           Разница между ценой и этой суммой уйдёт в капитал.</div>`;
    ok = AMT()>0;
  }
  if(kind==='prop_writeoff'&&o){
    extra=''; ok=true;
    hint=`Спишется вся стоимость — ${fmt(o.bal)} ${SIGN}. Денег не поступит.`;
  }
  if(kind==='loan_return'&&o){ ok=AMT()>0;
    if(AMT()>o.owe+0.005)hint=`Больше долга на ${fmt(AMT()-o.owe)} ${SIGN} — остаток уйдёт в минус.`; }
  if(kind==='debt_repay'&&o){ ok=AMT()>0;
    if(AMT()>o.debt+0.005)hint=`Больше долга на ${fmt(AMT()-o.debt)} ${SIGN} — остаток уйдёт в минус.`; }
  if(['prop_buy','loan_give','debt_take'].includes(kind)){
    ok = AMT()>0 && ($('#nameCard').hidden || $('#fname').value.trim()!=='');
  }
  $('#amtExtra').innerHTML=extra;
  $('#hint').textContent=hint;
  $('#save').disabled=!ok;
  if(!$('#ledger').hidden)drawLedger();
}

/* ═══ проводки ═══ */
function lines(){
  const o=obj?obj.o:null, a=AMT();
  const nm=$('#fname').value.trim()||'новый объект';
  switch(kind){
    case 'prop_buy': return a?[{s:'Д',a:'Имущество · '+nm,m:a,t:'Покупка имущества'},
                               {s:'К',a:'Деньги · '+money.name,m:a}]:[];
    case 'prop_revalue': {
      if(!o||!a)return[]; const d=a-o.bal; if(Math.abs(d)<0.005)return[];
      return d>0?[{s:'Д',a:'Имущество · '+o.name,m:d},{s:'К',a:REV,m:d}]
                :[{s:'Д',a:REV,m:-d},{s:'К',a:'Имущество · '+o.name,m:-d}];
    }
    case 'prop_sell': {
      if(!o||!a)return[]; const d=a-o.bal; const L=[{s:'Д',a:'Деньги · '+money.name,m:a,t:'Продажа имущества'}];
      if(d<0)L.push({s:'Д',a:CAP,m:-d});
      L.push({s:'К',a:'Имущество · '+o.name,m:o.bal});
      if(d>0)L.push({s:'К',a:CAP,m:d});
      return L;
    }
    case 'prop_writeoff': return o?[{s:'Д',a:CAP,m:o.bal},{s:'К',a:'Имущество · '+o.name,m:o.bal}]:[];
    case 'loan_give': return a?[{s:'Д',a:'Дебитор · '+(o&&obj.t==='c'?o.name:nm),m:a,t:'Выдача займа'},
                                {s:'К',a:'Деньги · '+money.name,m:a}]:[];
    case 'loan_return': return a?[{s:'Д',a:'Деньги · '+money.name,m:a},
                                  {s:'К',a:'Дебитор · '+o.name,m:a,t:'Возврат займа'}]:[];
    case 'debt_take': return a?[{s:'Д',a:'Деньги · '+money.name,m:a},
                                {s:'К',a:'Кредитор · '+(o&&obj.t==='c'?o.name:nm),m:a,t:'Получение займа'}]:[];
    case 'debt_repay': return a?[{s:'Д',a:'Кредитор · '+o.name,m:a,t:'Гашение долга'},
                                 {s:'К',a:'Деньги · '+money.name,m:a}]:[];
  }
  return [];
}
function drawLedger(){
  const L=lines();
  if(!L.length){$('#ledger').innerHTML='<span class="k">заполните форму</span>';return}
  const d=L.filter(l=>l.s==='Д').reduce((x,l)=>x+l.m,0);
  const c=L.filter(l=>l.s==='К').reduce((x,l)=>x+l.m,0);
  $('#ledger').innerHTML=`<div class="k">transaction · kind=${kind} · ${$('#date').value} · контур RUB</div><hr>
    <table>${L.map(l=>`<tr><td class="${l.s==='Д'?'d':'c'}">${l.s}</td>
      <td>&nbsp;${l.a}${l.t?` <span class="k">[${l.t}]</span>`:''}</td>
      <td class="n">${fmt(l.m)} RUB</td></tr>`).join('')}</table><hr>
    <div class="inv"><span>Σ base(Д) = Σ base(К)</span>
      <span>${fmt(d)} = ${fmt(c)} ${Math.abs(d-c)<0.005?'✓':'✗'}</span></div>`;
}

/* ═══ сохранение ═══ */
function save(){
  const a=AMT(), o=obj?obj.o:null, nm=$('#fname').value.trim(), dt=$('#date').value;
  const rec=(title,amt,sign,objT,objId,note)=>hist.unshift({id:seq++,kind,date:dt,title,amt,sign,objT,objId,note});
  switch(kind){
    case 'prop_buy':{ const p={id:Date.now(),name:nm,bal:a,last:dt}; PROP.push(p); money.bal-=a;
      rec('Покупка',a,1,'p',p.id,money.name); break; }
    case 'prop_revalue':{ const d=a-o.bal; o.bal=a; o.last=dt;
      rec('Переоценка',Math.abs(d),d>=0?1:-1,'p',o.id,d>=0?'подорожало':'подешевело'); break; }
    case 'prop_sell':{ money.bal+=a; const d=a-o.bal;
      rec('Продажа',a,1,'p',o.id,(d>=0?'прибыль ':'убыток ')+fmt(Math.abs(d)));
      o.bal=0; break; }
    case 'prop_writeoff':{ rec('Списание',o.bal,-1,'p',o.id,'убыток'); o.bal=0; break; }
    case 'loan_give':{ let c=obj&&obj.t==='c'?o:null;
      if(!c){c={id:Date.now(),name:nm,owe:0,debt:0};CTR.push(c)}
      c.owe+=a; money.bal-=a; rec('Выдан заём',a,1,'c',c.id,money.name); obj={t:'c',o:c}; break; }
    case 'loan_return':{ o.owe-=a; money.bal+=a; rec('Возврат от дебитора',a,-1,'c',o.id,money.name); break; }
    case 'debt_take':{ let c=obj&&obj.t==='c'?o:null;
      if(!c){c={id:Date.now(),name:nm,owe:0,debt:0};CTR.push(c)}
      c.debt+=a; money.bal+=a; rec('Получен заём',a,1,'c',c.id,money.name); obj={t:'c',o:c}; break; }
    case 'debt_repay':{ o.debt-=a; money.bal-=a; rec('Погашение долга',a,-1,'c',o.id,money.name); break; }
  }
  toast('Записано'); closeForm(); drawMain();
  if(!$('#obj').hidden&&obj)openObj((obj.t)+(obj.o.id));
}
function closeForm(){$('#form').hidden=true; if($('#obj').hidden)document.body.style.overflow=''}

/* ═══ события ═══ */
$('#plus').onclick=()=>{$('#sheet').hidden=false};
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').hidden=true};
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  $('#sheet').hidden=true; obj=null; openForm(b.dataset.a);
});
$('#objBack').onclick=()=>{$('#obj').hidden=true;document.body.style.overflow='';drawMain()};
$('#close').onclick=closeForm;
$('#save').onclick=save;
$('#amt').addEventListener('input',refresh);
$('#fname').addEventListener('input',refresh);
$('#ledToggle').onclick=()=>{
  const l=$('#ledger');l.hidden=!l.hidden;
  $('#ledToggle').textContent=l.hidden?'▸ показать проводку':'▾ скрыть проводку';
  if(!l.hidden)drawLedger();
};
drawMain();
</script>
