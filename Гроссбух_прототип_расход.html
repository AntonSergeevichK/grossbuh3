<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Гроссбух — ввод расхода</title>
<style>
:root{
  --paper:#E9EDF1;
  --card:#FFFFFF;
  --ink:#0F1A21;
  --soft:#5C6C78;
  --line:#D8E0E7;
  --accent:#0E6E62;
  --accent-bg:#E0EFEC;
  --clay:#A9501F;
  --clay-bg:#F6E9E1;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:0 0 40px;
}
.wrap{max-width:430px;margin:0 auto;padding:0 14px}

/* ── шапка ───────────────────────────────── */
.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 2px 12px;
}
.top h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
.taps{
  font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--soft);background:var(--card);border:1px solid var(--line);
  padding:6px 9px;border-radius:20px;
}
.taps b{color:var(--accent);font-size:12px}

/* ── карточка ────────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:12px;
}
.lbl{
  display:block;font-size:11px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--soft);margin-bottom:9px;
}

/* ── сумма ───────────────────────────────── */
.amount-row{display:flex;align-items:baseline;justify-content:center;gap:6px}
#amount{
  font:600 40px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums;
  border:none;outline:none;text-align:right;width:100%;max-width:250px;
  color:var(--ink);background:transparent;padding:4px 0;
}
#amount::placeholder{color:#C3CDD5}
.cur{font:500 22px/1 ui-monospace,monospace;color:var(--soft)}
.date-row{display:flex;justify-content:center;margin-top:10px}
.chip-date{
  font-size:13px;color:var(--soft);background:var(--paper);
  border:1px solid var(--line);border-radius:20px;padding:6px 13px;cursor:pointer;
}
.chip-date input{border:none;background:none;font:inherit;color:inherit;width:104px;padding:0}

/* ── чипы ────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:9px;padding:9px 12px;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.12s;
}
.chip:active{transform:scale(.97)}
.chip.on{border-color:var(--accent);background:var(--accent-bg);font-weight:600}
.chip .bal{font:11px/1 ui-monospace,monospace;color:var(--soft)}
.chip.on .bal{color:var(--accent)}

/* ── поиск статьи ────────────────────────── */
.search{
  width:100%;border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;font-size:14px;outline:none;margin-bottom:9px;
  background:var(--card);color:var(--ink);
}
.search:focus{border-color:var(--accent)}
.art-group{font-size:11px;color:var(--soft);margin:10px 0 6px;font-weight:600}

/* ── разбивка ────────────────────────────── */
.split-line{
  display:flex;align-items:center;gap:8px;padding:9px 0;
  border-bottom:1px solid var(--line);
}
.split-line:last-of-type{border-bottom:none}
.split-name{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.split-amt{
  width:94px;text-align:right;border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font:14px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums;
  outline:none;color:var(--ink);
}
.split-amt:focus{border-color:var(--accent)}
.x{border:none;background:none;color:var(--soft);font-size:19px;cursor:pointer;padding:0 3px;line-height:1}
.rest{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:11px;padding:9px 11px;border-radius:9px;font-size:13px;
  background:var(--clay-bg);color:var(--clay);
}
.rest.ok{background:var(--accent-bg);color:var(--accent)}
.rest span:last-child{font:600 13px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ── раскрытие ───────────────────────────── */
.more{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.more button{
  border:1px dashed var(--line);background:none;color:var(--soft);
  border-radius:9px;padding:9px 12px;font-size:13px;cursor:pointer;
}
.more button:active{border-color:var(--accent);color:var(--accent)}
textarea,select{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  font:14px system-ui,sans-serif;outline:none;background:var(--card);color:var(--ink);
}
textarea{resize:vertical;min-height:62px}

/* ── сохранить ───────────────────────────── */
.save{
  width:100%;border:none;border-radius:12px;padding:16px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;
}
.save:disabled{background:#B8C4CC;cursor:default}
.save:active:not(:disabled){opacity:.88}

/* ── проводка ────────────────────────────── */
.led-head{
  width:100%;background:none;border:none;color:var(--soft);font-size:13px;
  padding:14px 2px;cursor:pointer;display:flex;justify-content:center;gap:6px;
}
.ledger{
  background:#0F1A21;color:#C8D6DE;border-radius:var(--r);padding:14px;
  font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums;overflow-x:auto;
}
.ledger .k{color:#5C7A88}
.ledger .d{color:#7FD1C1}
.ledger .c{color:#E8B08A}
.ledger table{border-collapse:collapse;width:100%}
.ledger td{padding:2px 0}
.ledger td.n{text-align:right;padding-left:14px;white-space:nowrap}
.ledger hr{border:none;border-top:1px solid #24333D;margin:9px 0}
.inv{display:flex;justify-content:space-between;color:#7FD1C1}

/* ── история ─────────────────────────────── */
.hist{margin-top:22px}
.hist h2{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin:0 0 9px 2px}
.op{
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;margin-bottom:7px;display:flex;justify-content:space-between;
  align-items:center;gap:10px;
}
.op-l{min-width:0}
.op-t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-s{font-size:12px;color:var(--soft);margin-top:2px}
.op-r{display:flex;align-items:center;gap:9px;flex-shrink:0}
.op-a{font:600 14px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}
.copy{border:1px solid var(--line);background:none;border-radius:7px;padding:6px 9px;font-size:12px;color:var(--soft);cursor:pointer}
.copy:active{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--soft);font-size:13px;padding:2px}

/* ── тост ────────────────────────────────── */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,80px);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:11px;
  font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;
}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>Расход</h1>
    <div class="taps">касаний: <b id="tapN">0</b></div>
  </div>

  <!-- сумма -->
  <div class="card">
    <div class="amount-row">
      <input id="amount" inputmode="decimal" placeholder="0" autocomplete="off">
      <span class="cur" id="curSign">₽</span>
    </div>
    <div class="date-row">
      <label class="chip-date">📅 <input type="date" id="date"></label>
    </div>
  </div>

  <!-- счёт -->
  <div class="card">
    <span class="lbl">Откуда</span>
    <div class="chips" id="accs"></div>
  </div>

  <!-- статья -->
  <div class="card" id="artCard">
    <span class="lbl">На что</span>
    <input class="search" id="artSearch" placeholder="Поиск статьи" autocomplete="off">
    <div id="artList"></div>
  </div>

  <!-- разбивка -->
  <div class="card" id="splitCard" hidden>
    <span class="lbl">Разбивка по статьям</span>
    <div id="splitLines"></div>
    <input class="search" id="splitSearch" placeholder="Добавить статью" autocomplete="off" style="margin-top:10px">
    <div id="splitPick"></div>
    <div class="rest" id="rest"><span>Осталось распределить</span><span id="restN">0,00</span></div>
  </div>

  <div class="more">
    <button id="bSplit">+ разбить по статьям</button>
    <button id="bProj">+ проект</button>
    <button id="bDesc">+ описание</button>
  </div>

  <div class="card" id="projCard" hidden>
    <span class="lbl">Проект</span>
    <select id="proj">
      <option value="">— без проекта —</option>
      <option>Ремонт квартиры</option>
      <option>Непал 2026</option>
      <option>Камчатка 2026</option>
    </select>
  </div>

  <div class="card" id="descCard" hidden>
    <span class="lbl">Описание</span>
    <textarea id="desc" placeholder="Необязательно"></textarea>
  </div>

  <button class="save" id="save" disabled>Сохранить</button>

  <button class="led-head" id="ledToggle">▸ показать проводку</button>
  <div class="ledger" id="ledger" hidden></div>

  <div class="hist">
    <h2>Последние операции</h2>
    <div id="hist"><div class="empty">Пока пусто — сохраните первую трату</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ── данные ─────────────────────────────────────────── */
const ACCOUNTS = [
  {id:1, name:'Альфа-Банк',  cur:'RUB', sign:'₽', bal:48250},
  {id:2, name:'Наличные',    cur:'RUB', sign:'₽', bal:7300},
  {id:3, name:'Кредитка',    cur:'RUB', sign:'₽', bal:67890, credit:true},
  {id:4, name:'Кошелёк €',   cur:'EUR', sign:'€', bal:420}
];
// частота — из статистики v2.2: список сортируется, но ничего не подставляется
const ARTICLES = [
  {id:1,  name:'Кафе и рестораны', grp:'Питание',      freq:1546},
  {id:2,  name:'Продукты',         grp:'Питание',      freq:802},
  {id:3,  name:'Общественный транспорт', grp:'Транспорт', freq:530},
  {id:4,  name:'Топливо',          grp:'Автомобиль',   freq:380},
  {id:5,  name:'Подарки',          grp:'Прочее',       freq:316},
  {id:6,  name:'Коммунальные услуги', grp:'Жильё',     freq:301},
  {id:7,  name:'Такси',            grp:'Транспорт',    freq:241},
  {id:8,  name:'Хозтовары',        grp:'Дом и быт',    freq:233},
  {id:9,  name:'Косметика и гигиена', grp:'Уход',      freq:197},
  {id:10, name:'Банковские комиссии', grp:'Финансы',   freq:149},
  {id:11, name:'Развлечения',      grp:'Досуг',        freq:134},
  {id:12, name:'Проценты по кредитам', grp:'Финансы',  freq:123},
  {id:13, name:'Билеты',           grp:'Путешествия',  freq:113},
  {id:14, name:'Лекарства',        grp:'Здоровье',     freq:57},
  {id:15, name:'Мобильная связь',  grp:'Связь',        freq:50},
  {id:16, name:'Одежда и обувь',   grp:'Прочее',       freq:46},
  {id:17, name:'Интернет',         grp:'Связь',        freq:22},
  {id:18, name:'Прочие расходы',   grp:'Прочее',       freq:109}
].sort((a,b)=>b.freq-a.freq);

const CAPITAL = 'Капитал · заработанный';
const RATE = {RUB:1, EUR:92.4};      // курс на дату операции

/* ── состояние ──────────────────────────────────────── */
let acc = ACCOUNTS[0];               // последний использованный
let art = null;
let split = [];                      // [{artId, amount}]
let splitOn = false;
let taps = 0;
let history = [];

/* ── утилиты ────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const fmt = n => (n||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const parse = s => { const v = parseFloat(String(s).replace(/\s/g,'').replace(',','.')); return isNaN(v)?0:v; };
const total = () => parse($('#amount').value);
const artName = id => (ARTICLES.find(a=>a.id===id)||{}).name || '';

function tap(){ taps++; $('#tapN').textContent = taps; }
document.addEventListener('pointerdown', e => {
  if (e.target.closest('button, .chip, input, select, textarea, label')) tap();
});

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ── счета ──────────────────────────────────────────── */
function drawAccounts(){
  $('#accs').innerHTML = '';
  ACCOUNTS.forEach(a=>{
    const b = document.createElement('button');
    b.className = 'chip' + (a.id===acc.id ? ' on' : '');
    b.innerHTML = `<span>${a.name}</span><span class="bal">${fmt(a.bal)} ${a.sign}</span>`;
    b.onclick = ()=>{ acc = a; $('#curSign').textContent = a.sign; drawAccounts(); refresh(); };
    $('#accs').appendChild(b);
  });
}

/* ── статьи ─────────────────────────────────────────── */
function drawArticles(filter=''){
  const box = $('#artList'); box.innerHTML = '';
  const f = filter.trim().toLowerCase();
  const list = ARTICLES.filter(a=>!f || a.name.toLowerCase().includes(f));
  if (!f){
    const h = document.createElement('div');
    h.className = 'art-group'; h.textContent = 'Частые';
    box.appendChild(h);
  }
  const chips = document.createElement('div');
  chips.className = 'chips';
  (f ? list : list.slice(0,8)).forEach(a=>{
    const b = document.createElement('button');
    b.className = 'chip' + (art && art.id===a.id ? ' on' : '');
    b.textContent = a.name;
    b.onclick = ()=>{ art = a; drawArticles($('#artSearch').value); refresh(); };
    chips.appendChild(b);
  });
  box.appendChild(chips);
}

/* ── разбивка ───────────────────────────────────────── */
function drawSplit(){
  const box = $('#splitLines'); box.innerHTML = '';
  split.forEach((s,i)=>{
    const row = document.createElement('div');
    row.className = 'split-line';
    row.innerHTML = `<span class="split-name">${artName(s.artId)}</span>`;
    const inp = document.createElement('input');
    inp.className = 'split-amt'; inp.inputMode = 'decimal';
    inp.value = s.amount ? fmt(s.amount) : '';
    inp.placeholder = '0,00';
    inp.oninput = ()=>{ split[i].amount = parse(inp.value); refresh(false); };
    inp.onblur  = ()=>{ inp.value = split[i].amount ? fmt(split[i].amount) : ''; };
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '×';
    x.onclick = ()=>{ split.splice(i,1); drawSplit(); refresh(); };
    row.append(inp, x);
    box.appendChild(row);
  });

  const pick = $('#splitPick'); pick.innerHTML = '';
  const f = $('#splitSearch').value.trim().toLowerCase();
  if (f){
    const chips = document.createElement('div');
    chips.className = 'chips'; chips.style.marginTop = '8px';
    ARTICLES.filter(a=>a.name.toLowerCase().includes(f) && !split.some(s=>s.artId===a.id))
      .slice(0,6).forEach(a=>{
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = a.name;
        b.onclick = ()=>{
          split.push({artId:a.id, amount:0});
          $('#splitSearch').value = '';
          drawSplit(); refresh();
        };
        chips.appendChild(b);
      });
    pick.appendChild(chips);
  }
}

function splitSum(){ return split.reduce((s,x)=>s+(x.amount||0),0); }

/* ── проводка ───────────────────────────────────────── */
function lines(){
  const t = total(), r = RATE[acc.cur];
  if (!t) return [];
  const out = [];
  if (splitOn && split.length){
    split.forEach(s=>out.push({side:'Д', acc:CAPITAL, art:artName(s.artId), amt:s.amount||0, cur:acc.cur, rate:r}));
  } else if (art){
    out.push({side:'Д', acc:CAPITAL, art:art.name, amt:t, cur:acc.cur, rate:r});
  }
  out.push({side:'К', acc:acc.name, art:'', amt:t, cur:acc.cur, rate:r});
  return out;
}

function drawLedger(){
  const L = lines();
  if (!L.length){ $('#ledger').innerHTML = '<span class="k">введите сумму</span>'; return; }
  const d = L.filter(l=>l.side==='Д').reduce((s,l)=>s+l.amt*l.rate,0);
  const c = L.filter(l=>l.side==='К').reduce((s,l)=>s+l.amt*l.rate,0);
  let rows = L.map(l=>`<tr>
      <td class="${l.side==='Д'?'d':'c'}">${l.side}</td>
      <td>&nbsp;${l.acc}${l.art?` <span class="k">[${l.art}]</span>`:''}</td>
      <td class="n">${fmt(l.amt)} ${l.cur}</td>
    </tr>`).join('');
  $('#ledger').innerHTML = `
    <div class="k">transaction · kind=expense · ${$('#date').value} · контур RUB${$('#proj').value?` · проект: ${$('#proj').value}`:''}</div>
    <hr>
    <table>${rows}</table>
    <hr>
    <div class="inv"><span>Σ base(Д) = Σ base(К)</span><span>${fmt(d)} = ${fmt(c)} ${Math.abs(d-c)<0.005?'✓':'✗'}</span></div>`;
}

/* ── валидация и перерисовка ────────────────────────── */
function refresh(redrawSplit=true){
  const t = total();
  if (splitOn){
    const rest = t - splitSum();
    $('#restN').textContent = fmt(rest);
    $('#rest').classList.toggle('ok', Math.abs(rest)<0.005 && split.length>0);
    $('#rest').firstElementChild.textContent = rest < -0.005 ? 'Распределено больше суммы' : 'Осталось распределить';
    if (redrawSplit) drawSplit();
  }
  const ok = t>0 && (splitOn ? (split.length>0 && Math.abs(t-splitSum())<0.005) : !!art);
  $('#save').disabled = !ok;
  if (!$('#ledger').hidden) drawLedger();
}

/* ── сохранение ─────────────────────────────────────── */
function save(){
  const t = total();
  const label = splitOn ? split.map(s=>artName(s.artId)).join(' + ') : art.name;
  acc.bal -= t;
  history.unshift({
    label, amt:t, acc:acc.name, sign:acc.sign,
    date:$('#date').value, desc:$('#desc').value,
    proj:$('#proj').value,
    artId: splitOn ? null : art.id
  });
  drawHistory(); drawAccounts();
  toast(`Записано: ${fmt(t)} ${acc.sign} · касаний ${taps}`);
  reset();
}

function reset(){
  $('#amount').value=''; $('#desc').value=''; $('#proj').value='';
  art=null; split=[]; splitOn=false;
  $('#splitCard').hidden=true; $('#artCard').hidden=false;
  $('#projCard').hidden=true; $('#descCard').hidden=true;
  $('#artSearch').value=''; $('#splitSearch').value='';
  taps=0; $('#tapN').textContent=0;
  drawArticles(); refresh();
}

function drawHistory(){
  const box = $('#hist');
  if (!history.length){ box.innerHTML='<div class="empty">Пока пусто — сохраните первую трату</div>'; return; }
  box.innerHTML='';
  history.slice(0,6).forEach(h=>{
    const el = document.createElement('div');
    el.className='op';
    el.innerHTML = `<div class="op-l">
        <div class="op-t">${h.label}</div>
        <div class="op-s">${h.acc}${h.proj?' · '+h.proj:''}${h.desc?' · '+h.desc:''}</div>
      </div>
      <div class="op-r"><span class="op-a">−${fmt(h.amt)} ${h.sign}</span></div>`;
    const c = document.createElement('button');
    c.className='copy'; c.textContent='копия';
    c.onclick = ()=>{
      // копия = форма с заполненными полями; дата, курс и контур — заново
      $('#amount').value = fmt(h.amt);
      acc = ACCOUNTS.find(a=>a.name===h.acc) || acc;
      $('#curSign').textContent = acc.sign;
      art = ARTICLES.find(a=>a.id===h.artId) || null;
      split=[]; splitOn=false; $('#splitCard').hidden=true; $('#artCard').hidden=false;
      $('#desc').value = h.desc||''; $('#descCard').hidden = !h.desc;
      $('#proj').value = h.proj||''; $('#projCard').hidden = !h.proj;
      $('#date').valueAsDate = new Date();      // всегда сегодня
      drawAccounts(); drawArticles(); refresh();
      window.scrollTo({top:0,behavior:'smooth'});
      toast(h.artId ? 'Поля заполнены' : 'Разбивку выберите заново');
    };
    el.querySelector('.op-r').appendChild(c);
    box.appendChild(el);
  });
}

/* ── события ────────────────────────────────────────── */
$('#amount').addEventListener('input', ()=>refresh());
$('#amount').addEventListener('blur', e=>{ const v=parse(e.target.value); e.target.value = v?fmt(v):''; });
$('#amount').addEventListener('focus', e=>{ const v=parse(e.target.value); e.target.value = v?String(v).replace('.',','):''; });
$('#artSearch').addEventListener('input', e=>drawArticles(e.target.value));
$('#splitSearch').addEventListener('input', ()=>drawSplit());

$('#bSplit').onclick = ()=>{
  splitOn = !splitOn;
  $('#splitCard').hidden = !splitOn;
  $('#artCard').hidden = splitOn;
  $('#bSplit').textContent = splitOn ? '− без разбивки' : '+ разбить по статьям';
  if (splitOn && art && !split.length) split.push({artId:art.id, amount:total()});
  drawSplit(); refresh();
};
$('#bProj').onclick = ()=>{ $('#projCard').hidden = !$('#projCard').hidden; };
$('#bDesc').onclick = ()=>{ $('#descCard').hidden = !$('#descCard').hidden; if(!$('#descCard').hidden) $('#desc').focus(); };
$('#ledToggle').onclick = ()=>{
  const l = $('#ledger'); l.hidden = !l.hidden;
  $('#ledToggle').textContent = l.hidden ? '▸ показать проводку' : '▾ скрыть проводку';
  if (!l.hidden) drawLedger();
};
$('#save').onclick = save;

/* ── старт ──────────────────────────────────────────── */
$('#date').valueAsDate = new Date();
$('#curSign').textContent = acc.sign;
drawAccounts(); drawArticles(); refresh();
taps=0; $('#tapN').textContent=0;
</script>
</body>
</html>
